name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build DMG
        run: tools/release/build-macos.sh arm64

      - uses: actions/upload-artifact@v4
        with:
          name: NotepadMoreOS-macOS-arm64
          path: |
            artifacts/*.dmg
            artifacts/*macOS-*.zip
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: tools/release/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NotepadMoreOS-windows-x64
          path: |
            artifacts/*setup.exe
            artifacts/*windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build packages
        run: tools/release/build-linux.sh x64

      - uses: actions/upload-artifact@v4
        with:
          name: NotepadMoreOS-linux-x64
          path: |
            artifacts/*linux-amd64.deb
            artifacts/*linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Instaladores do NotepadMoreOS.

            > O app não é assinado/notarizado pela Apple. No macOS, o `.dmg` pode ser bloqueado
            > **antes de montar** — nesse caso use o `.zip`, que abre sem problema.

            - **macOS (Apple Silicon) — recomendado:** baixe o `.zip`, extraia e arraste o NotepadMoreOS para Aplicativos. Na primeira abertura o macOS bloqueia; vá em **Ajustes do Sistema → Privacidade e Segurança**, role até **Segurança** e clique em **Abrir Mesmo Assim**.
            - **macOS (Apple Silicon) — `.dmg`:** se o sistema recusar abrir o disco, rode `xattr -d com.apple.quarantine ~/Downloads/NotepadMoreOS-*.dmg` no Terminal e abra de novo. (O atalho "botão direito → Abrir" não existe desde o macOS 15.)
            - **Windows x64:** execute o `setup.exe`. Se o SmartScreen avisar, escolha "Mais informações" → "Executar assim mesmo".
            - **Linux:** `sudo apt install ./NotepadMoreOS-*-linux-amd64.deb` (Debian/Ubuntu) ou use o `.tar.gz` portátil.

            Os avisos de Gatekeeper e SmartScreen são esperados. Para eliminá-los seria necessário
            um certificado Apple Developer ID + notarização e um certificado Authenticode.
